<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MCP stdio IPC (EdgeHTML)</title>
  </head>
  <body>
    <h1>MCP stdio IPC (EdgeHTML)</h1>
    <button id="run">Run evaluate_js</button>
    <pre id="result">Click the button to evaluate JavaScript.</pre>
    <script>
      document.getElementById('run').onclick = function () {
        var output = document.getElementById('result');
        output.textContent = 'Running...';
        try {
          window.mcp.tools.call('evaluate_js', {
            script: 'return 1 + 2;',
            allowUnsafeEval: true
          }, function (error, result) {
            if (error) {
              output.textContent = 'Error: ' + error.message;
            } else {
              output.textContent = result.content && result.content.length
                ? result.content[0].text
                : 'MCP returned an empty result';
            }
          });
        } catch (error) {
          output.textContent = 'Error: ' + error.message;
        }
      };
    </script>
  </body>
</html>
