<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MSHTML backend example</title>
</head>
<body>
  <h1>MSHTML backend</h1>
  <p>This page is loaded from a local file.</p>
  <button onclick="window.external.invoke('hello')">Call native code</button>

</body>
</html>
